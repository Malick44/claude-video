# Mimics Supabase's URL layout so the app's supabase-js client works unchanged.
server {
  listen 8080;
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
  # No storage service locally: uploads fail fast and the worker skips keyframe URLs.
  location /storage/v1/ { return 503; }
}
